<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechMart - Đăng Ký Thành Viên</title>
  <script>(function(){try{if(localStorage.getItem("giaoDien")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-trong">
      <a href="index.html" class="logo">⚡ TechMart</a>

      <ul class="menu-nav">
        <li><a href="index.html">Trang Chủ</a></li>
        <li><a href="products.html">Sản Phẩm</a></li>
        <li><a href="cart.html">Giỏ Hàng</a></li>
        <li><a href="upload-product.html">Up Sản Phẩm</a></li>
        <li><a href="contact.html" class="active">Đăng Ký</a></li>
        <li><a href="account.html">Tài Khoản</a></li>
      </ul>

      <div class="header-actions">
        <a href="products.html?view=yeu-thich" class="icon-tim">
          ❤ <span id="soLuongYeuThich">0</span>
        </a>

        <a href="cart.html" class="icon-gio">
          🛒 <span id="soLuongGio">0</span>
        </a>

        <button type="button" class="btn-theme-toggle" onclick="doiGiaoDien()" title="Chuyển giao diện Sáng/Tối">🌙</button>
      </div>
    </div>
  </header>

  <!-- NỘI DUNG FORM ĐĂNG KÝ -->
  <div class="container">

    <h1 class="tieu-de-trang">Đăng Ký Thành Viên</h1>

    <div class="form-hop">

      <form id="formDangKy" onsubmit="return xuLyDangKy()">

        <!-- Họ và Tên -->
        <div class="form-nhom">
          <label for="ten">Họ và Tên *</label>
          <input type="text" id="ten" placeholder="Ví dụ: Nguyễn Văn A">
          <span id="loi-ten" class="thong-bao-loi"></span>
        </div>

        <!-- Email -->
        <div class="form-nhom">
          <label for="email">Email *</label>
          <input type="email" id="email" placeholder="Ví dụ: abc@gmail.com">
          <span id="loi-email" class="thong-bao-loi"></span>
        </div>

        <!-- Số điện thoại -->
        <div class="form-nhom">
          <label for="sdt">Số Điện Thoại *</label>
          <input type="text" id="sdt" placeholder="Ví dụ: 0912345678">
          <span id="loi-sdt" class="thong-bao-loi"></span>
        </div>

        <!-- Mật khẩu -->
        <div class="form-nhom">
          <label for="matkhau">Mật Khẩu *</label>
          <input type="password" id="matkhau" placeholder="Tối thiểu 6 ký tự">
          <span id="loi-matkhau" class="thong-bao-loi"></span>
        </div>

        <!-- Nút đăng ký -->
        <button type="submit" class="btn-gui-form">Đăng Ký Ngay</button>

      </form>

    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 TechMart Store - WEB1044 Assignment - FPT Polytechnic</p>
  </footer>

  <!-- Nhúng JavaScript -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>

  <!-- Xử lý submit form -->
  <script>
    function xuLyDangKy() {
      // Gọi hàm validate trong main.js
      var hopLe = validateFormDangKy();

      if (hopLe) {
        hienThiPopup("Đăng ký thành công! Chào mừng bạn đến với TechMart! 🎉", "success");
        document.getElementById("formDangKy").reset();
      }

      // return false để tránh trang bị reload
      return false;
    }
  </script>
</body>
</html>
